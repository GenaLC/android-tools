; DID не из таблицы — телефон не должен получать чужие вызовы.
exten => _X.,1,NoOp(GSM DID ${GSM_DID} not mapped)
 same => n,Hangup()

; Исходящая нога вручную: сначала задать GSM_PHONE, потом
; Goto(gsm-outbound,<номер>,1). Обычно исходящий вызов агента идёт
; через маршрут FreePBX (trunks-routes.sql) — этому контексту.
; Если GSM_PHONE не задан — берётся первый телефон из phones.csv,
; как в старой ручной версии на 1001.
[gsm-outbound]
exten => _+X.,1,NoOp(GSM gateway: outbound to ${EXTEN} via ${GSM_PHONE})
 same => n,GotoIf($["${GSM_PHONE}" != ""]?dial)
 same => n,Set(GSM_PHONE=1001)
 same => n(dial),Dial(PJSIP/${EXTEN}@${GSM_PHONE},60)
 same => n,Hangup()

; Заголовок для приложения: номер, который нужно набрать в GSM.
[add-gsm-forward]
exten => s,1,Set(PJSIP_HEADER(add,X-GSM-Forward)=${1})
 same => n,Return()
