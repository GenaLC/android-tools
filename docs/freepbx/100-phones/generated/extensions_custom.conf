;
; GSM-SIP шлюз — 100 телефон(ов).
; Сгенерировано gen.py из phones.csv. Правьте phones.csv, не этот файл.
;
; Входящая GSM-нога: телефон шлёт INVITE с Request-URI = свой
; "own number" (номер, записанный в приложении в поле слота SIM) и
; P-Asserted-Identity = номер абонента. Контекст [from-gsm-gateway]
; снимает ведущий плюс и уходит в таблицу DID ниже.

[from-gsm-gateway]
exten => _+X.,1,NoOp(GSM gateway: inbound DID=${EXTEN} from ${CALLERID(num)})
 same => n,Set(GSM_DID=${EXTEN})
 same => n,Goto(from-gsm-gateway-did,${EXTEN:1},1)
 same => n,Hangup()

; DID -> агент. Ключ — DID без ведущего плюса, значение — SIP-расширение
; агента, которому звонить. Один агент может обслуживать несколько
; телефонов: тогда у нескольких DID один и тот же агент.
[from-gsm-gateway-did]
exten => 380939104994,1,NoOp(GSM DID ${GSM_DID} -> 40181)
 same => n,Dial(PJSIP/40181,60)
 same => n,Hangup()

